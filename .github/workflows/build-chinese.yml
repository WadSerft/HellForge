# The fork's own builds (branch l10n/zh-cn: the launcher's Chinese localization and the verified-copy setup):
# a small reversible patch for an installed HellForge, and the complete HellForge-Setup.exe carrying it already
# applied. Run from the Actions page (Run workflow) or by a push to this branch.
name: Build the Chinese package

on:
  workflow_dispatch:
  push:
    branches: [l10n/zh-cn]

permissions:
  contents: read

concurrency:
  group: build-chinese-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The patch alone: a few minutes, no native toolchain (the launcher publishes plain .NET).
  launcher-patch:
    name: Build the reversible launcher patch
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish the launcher
        run: dotnet publish src/HellForge.Launcher/HellForge.Launcher.csproj -c Release --nologo -v q -o artifacts/patch
      - name: Assemble the patch zip
        shell: pwsh
        run: |
          $out = 'artifacts/HellForge-Chinese-Patch'
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($name in @(
              'HellForge.Launcher.dll', 'HellForge.Core.dll', 'HellForge.SteamDownload.dll',
              'HellForge.Launcher.exe', 'HellForge.Launcher.deps.json', 'HellForge.Launcher.runtimeconfig.json')) {
            Copy-Item (Join-Path 'artifacts/patch' $name) $out -Force
          }
          Copy-Item 'artifacts/patch/zh-CN' (Join-Path $out 'zh-CN') -Recurse -Force
          Copy-Item chinese-patch\apply.ps1, chinese-patch\README.md $out -Force
          Compress-Archive -Path $out -DestinationPath artifacts/HellForge-Chinese-Patch.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hellforge-chinese-patch
          path: artifacts/HellForge-Chinese-Patch.zip
          if-no-files-found: error

  # The complete installer, as the upstream nightly builds it (the native toolchain included).
  full-setup:
    name: Build HellForge-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-tools
        with:
          native: 'true'
      # A runner has no game files: the engine's steam_api64.dll stand-in is built from the text-only export list,
      # as the upstream nightly does.
      - name: scripts/Package-HellForge.ps1 (the release's package)
        shell: pwsh
        run: |
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'artifacts/tmp')).FullName
          ./scripts/Package-HellForge.ps1 -SteamExports data/steam-export-manifest.json
          # it throws on any failure; the last exit code of a program it ran must not decide
          exit 0
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: hellforge-setup-chinese
          path: |
            artifacts/package/HellForge-Setup.exe
            artifacts/package/HellForge-Linux-scripts.zip
          if-no-files-found: error
