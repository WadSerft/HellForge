# The fork's two setups (branch l10n/zh-cn):
# - hellforge-setup-verified-copy: the complete HellForge-Setup.exe from the verified-copy-setup branch (upstream main
#   plus "keep this installation's verified game copy": setup never asks Steam to download when the installed copy
#   already matches the supported build), the English UI as upstream;
# - hellforge-chinese-patch-setup: the small Chinese patch installer (src/HellForge.ChinesePatch), one exe that
#   applies the localization (keeping the launcher's files as ".pre-chinese") and, run again, puts them back.
# Run from the Actions page (Run workflow) or by a push to this branch.
name: Build the Chinese package

on:
  workflow_dispatch:
  push:
    branches: [l10n/zh-cn]

permissions:
  contents: read

concurrency:
  group: build-chinese-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The patch setup: a few minutes, no native toolchain.
  chinese-patch-setup:
    name: Build the Chinese patch setup
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish the launcher (the patch's payload)
        run: dotnet publish src/HellForge.Launcher/HellForge.Launcher.csproj -c Release --nologo -v q -o artifacts/patch
      - name: Zip the payload and build the patch setup around it
        shell: pwsh
        run: |
          $payload = Join-Path $env:GITHUB_WORKSPACE 'artifacts/payload.zip'
          Compress-Archive -Path @(
              'artifacts/patch/HellForge.Launcher.dll', 'artifacts/patch/HellForge.Core.dll', 'artifacts/patch/HellForge.SteamDownload.dll',
              'artifacts/patch/HellForge.Launcher.exe', 'artifacts/patch/HellForge.Launcher.deps.json', 'artifacts/patch/HellForge.Launcher.runtimeconfig.json',
              'artifacts/patch/zh-CN') -DestinationPath $payload -Force
          dotnet publish src/HellForge.ChinesePatch/HellForge.ChinesePatch.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true "-p:PayloadZip=$payload" --nologo -v q -o artifacts/patch-setup
          if ($LASTEXITCODE) { throw 'Building the patch setup failed.' }
          Copy-Item artifacts/patch-setup/HellForge-Chinese-Patch.exe artifacts/HellForge-Chinese-Patch-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hellforge-chinese-patch-setup
          path: artifacts/HellForge-Chinese-Patch-Setup.exe
          if-no-files-found: error

  # The complete installer from the verified-copy-setup branch, as the upstream nightly builds it.
  verified-copy-setup:
    name: Build HellForge-Setup.exe (verified copy)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verified-copy-setup
          persist-credentials: false
      - uses: ./.github/actions/build-tools
        with:
          native: 'true'
      # A runner has no game files: the engine's steam_api64.dll stand-in is built from the text-only export list,
      # as the upstream nightly does.
      - name: scripts/Package-HellForge.ps1 (the release's package)
        shell: pwsh
        run: |
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'artifacts/tmp')).FullName
          ./scripts/Package-HellForge.ps1 -SteamExports data/steam-export-manifest.json
          # it throws on any failure; the last exit code of a program it ran must not decide
          exit 0
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: hellforge-setup-verified-copy
          path: |
            artifacts/package/HellForge-Setup.exe
            artifacts/package/HellForge-Linux-scripts.zip
          if-no-files-found: error
